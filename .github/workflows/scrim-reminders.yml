name: Scrim reminder tick

# The scheduled trigger below is disabled -- GitHub deprioritizes
# `schedule:` crons on low-activity repos, and in practice this fired
# every ~3-4 hours instead of every 5 minutes, so scrims routinely
# went unreminded.
#
# The tick now runs INSIDE the bot process instead (src/lib/scheduler.js,
# started on 'ready' in index.js). That process is already long-lived and
# already kept awake by the uptime pinger on /health, so a timer there
# fires when it says it will, with no queue to sit in. Its state is
# reported under `scheduler` on /health -- worth a monitor, since the
# thing that made this failure so long-lived was that nothing reported
# the cron was under-firing.
#
# Do NOT re-enable `schedule:` here expecting it to help: a 3-4 hour
# cron cannot serve a 20-minute reminder window. If you ever want a
# belt-and-braces external trigger, point a reliable cron service at the
# same endpoint -- the sweep is idempotent (reminderSentAt), so running
# both changes nothing.
#
# The manual "Notify Opponent" button in the scrim lobby
# (js/views-scrims.js, 'reminder' event on /scrim-notify) also stays --
# it is a deliberate action, not a fallback.
#
# This workflow is kept for workflow_dispatch, so the endpoint can be
# poked by hand while debugging.
on:
  workflow_dispatch: {} # manual trigger only -- see note above

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Hit the reminder-tick endpoint
        # -f alone (the original version of this step) hides the actual
        # response body/status on any non-2xx, which makes a failure here
        # undebuggable from the Action log alone. Capture the status and
        # body explicitly, print both, THEN fail the step on a bad status
        # -- same end result (red X on error) with an actual reason visible.
        run: |
          http_code=$(curl -s -o response.txt -w "%{http_code}" -X POST "${{ secrets.BOT_BASE_URL }}/api/scrim-reminders-tick" \
            -H "x-api-key: ${{ secrets.BOT_API_KEY }}")
          echo "HTTP status: $http_code"
          echo "Response body:"
          cat response.txt
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            exit 1
          fi
